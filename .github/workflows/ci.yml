name: CI

on:
  push:
    branches: [main, codex/resume-readiness]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==2.4.6" "pandas==3.0.3"

      - name: Compile Python files
        run: python -m compileall -q fetch_csi300.py inspect_csi300.py src tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

